<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchday Calls — Free Football Match Predictions</title>
<meta name="description" content="Free daily football predictions for the Premier League, La Liga, Serie A, Bundesliga, Ligue 1, and more — with ELO ratings, live standings, and a public accuracy track record.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Matchday Calls — Free Football Match Predictions">
<meta property="og:description" content="Daily football predictions across major European leagues, with a public accuracy track record.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/home.css">
</head>
<body>

<nav>
  <a href="index.html" class="active">Home</a>
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="terms.html">Terms</a>
  <a href="privacy.html">Privacy</a>
</nav>

<header>
  <h1>Matchday Calls</h1>
  <p id="updated-line">Loading predictions&hellip;</p>
</header>

<main id="content">
  <div class="loading">Fetching the latest calls&hellip;</div>
</main>

<footer>
  Predictions blend recent form, ELO ratings, live standings, and head-to-head history.<br>
  Not betting advice &mdash; just a bit of fun. Football is genuinely hard to predict.<br>
  <a href="blog.html" style="color: var(--chalk-dim);">Blog</a> &middot; <a href="about.html" style="color: var(--chalk-dim);">About</a> &middot; <a href="terms.html" style="color: var(--chalk-dim);">Terms</a> &middot; <a href="privacy.html" style="color: var(--chalk-dim);">Privacy</a>
</footer>

<script>
const MARKET_NAMES = {
  double_chance: 'Double Chance',
  over_under: 'Over/Under 2.5',
  btts: 'Both Teams to Score'
};

function renderAccuracy(accuracy) {
  if (!accuracy) return '';

  const tiles = ['double_chance', 'over_under', 'btts'].map(key => {
    const stat = accuracy[key];
    const rateHtml = stat && stat.rate !== null
      ? `<div class="accuracy-rate">${stat.rate}%</div>`
      : `<div class="accuracy-rate no-data">Building<br>track record</div>`;
    const countText = stat && stat.total > 0 ? `${stat.correct}/${stat.total} picks` : '';
    return `
      <div class="accuracy-tile">
        ${rateHtml}
        <div class="accuracy-label">${MARKET_NAMES[key]}</div>
        <div class="accuracy-count">${countText}</div>
      </div>
    `;
  }).join('');

  let recentHtml = '';
  if (accuracy.recent && accuracy.recent.length > 0) {
    recentHtml = `
      <div class="recent-picks">
        ${accuracy.recent.slice(0, 5).map(r => `
          <div class="recent-pick-row">
            <span class="recent-pick-dot ${r.correct ? 'win' : 'loss'}"></span>
            <span class="recent-pick-text"><strong>${r.match}</strong> &mdash; ${r.pick}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="section-header"><h2>Track Record</h2><div class="line"></div></div>
    <div class="accuracy-grid">${tiles}</div>
    ${recentHtml}
  `;
}

function renderBestBets(bestBets) {
  if (!bestBets || bestBets.length === 0) return '';

  const cards = bestBets.map(b => {
    const date = new Date(b.date);
    const dateStr = date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `
      <div class="best-bet-card">
        <div class="best-bet-comp">${b.competition} &middot; ${dateStr}</div>
        <div class="best-bet-match">${b.home_team} vs ${b.away_team}</div>
        <div class="best-bet-row">
          <span class="best-bet-pick">${b.market_name}: ${b.pick}</span>
          <span class="best-bet-conf">${b.confidence}%</span>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="section-header"><h2>Best Bets Today</h2><div class="line"></div></div>
    ${cards}
  `;
}

async function loadData() {
  const content = document.getElementById('content');
  const updatedLine = document.getElementById('updated-line');

  try {
    const res = await fetch('data.json?_=' + Date.now());
    if (!res.ok) throw new Error('No data yet');
    const data = await res.json();

    if (!data.predictions || data.predictions.length === 0) {
      content.innerHTML = '<div class="empty">No upcoming fixtures found in the next 7 days. Check back soon.</div>';
      updatedLine.textContent = 'Waiting for the first update';
      return;
    }

    const generated = new Date(data.generated_at);
    updatedLine.textContent = 'Updated ' + generated.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    let html = renderBestBets(data.best_bets) + renderAccuracy(data.accuracy);

    const groups = {};
    data.predictions.forEach(m => {
      if (!groups[m.competition]) groups[m.competition] = [];
      groups[m.competition].push(m);
    });

    for (const [competition, matches] of Object.entries(groups)) {
      html += `<div class="section-header"><h2>${competition}</h2><div class="line"></div></div>`;
      matches.forEach(m => {
        const date = new Date(m.date);
        const dateStr = date.toLocaleString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const marketRows = Object.entries(m.markets).map(([key, market]) => {
          const isBest = key === m.best_market;
          return `
            <div class="market-row ${isBest ? 'best' : ''}">
              <div class="market-label">
                <span class="market-name">${MARKET_NAMES[key] || key}</span>
                <span class="market-pick">${market.pick}${isBest ? '<span class="best-badge">Strongest</span>' : ''}</span>
              </div>
              <span class="market-confidence">${market.confidence}%</span>
            </div>
          `;
        }).join('');

        html += `
          <div class="match-card">
            <div class="match-date">${dateStr}</div>
            <div class="teams">
              <div class="team home">
                ${m.home_crest ? `<img src="${m.home_crest}" alt="">` : ''}
                <span>${m.home_team}</span>
              </div>
              <span class="vs">VS</span>
              <div class="team away">
                <span>${m.away_team}</span>
                ${m.away_crest ? `<img src="${m.away_crest}" alt="">` : ''}
              </div>
            </div>
            ${m.h2h_note ? `<div class="h2h-note">${m.home_team} vs ${m.away_team}: ${m.h2h_note}</div>` : ''}
            <div class="markets">
              ${marketRows}
            </div>
          </div>
        `;
      });
    }

    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = '<div class="empty">No predictions yet. Once the daily update runs, matches will appear here automatically.</div>';
    updatedLine.textContent = 'Not updated yet';
  }
}

loadData();
</script>

</body>
</html>
