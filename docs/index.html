<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matchday Calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #08211A;
    --chalk: #F5F3EC;
    --chalk-dim: #B9C9BF;
    --floodlight: #E8C34A;
    --market-bg: rgba(245,243,236,0.04);
    --best-border: #E8C34A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 80px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  header {
    padding: 28px 20px 20px;
    border-bottom: 2px dashed rgba(245,243,236,0.25);
    text-align: center;
  }

  header h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    font-size: 34px;
    margin: 0 0 4px;
    color: var(--floodlight);
    text-transform: uppercase;
  }

  header p {
    margin: 0;
    color: var(--chalk-dim);
    font-size: 13px;
  }

  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 14px;
  }

  .competition-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 32px 6px 14px;
  }

  .competition-header .line {
    flex: 1;
    height: 1px;
    background: rgba(245,243,236,0.2);
  }

  .competition-header h2 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--chalk);
    margin: 0;
    white-space: nowrap;
  }

  .match-card {
    background: rgba(245,243,236,0.03);
    border: 1px solid rgba(245,243,236,0.1);
    border-radius: 10px;
    padding: 16px 16px 14px;
    margin-bottom: 12px;
  }

  .match-date {
    font-size: 11px;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }

  .team {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
  }

  .team.away { justify-content: flex-end; text-align: right; }

  .team img {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .vs {
    font-family: 'Anton', sans-serif;
    color: var(--floodlight);
    font-size: 13px;
    padding: 0 6px;
  }

  .markets {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .market-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    border-radius: 7px;
    background: var(--market-bg);
    border: 1px solid transparent;
  }

  .market-row.best {
    border-color: var(--best-border);
    background: rgba(232,195,74,0.08);
  }

  .market-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .market-name {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--chalk-dim);
  }

  .market-pick {
    font-size: 13px;
    font-weight: 700;
    color: var(--chalk);
  }

  .market-row.best .market-pick {
    color: var(--floodlight);
  }

  .market-confidence {
    font-size: 13px;
    font-weight: 700;
    color: var(--chalk-dim);
    white-space: nowrap;
  }

  .market-row.best .market-confidence {
    color: var(--floodlight);
  }

  .best-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: var(--floodlight);
    color: var(--pitch-dark);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
  }

  .empty, .loading {
    text-align: center;
    color: var(--chalk-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    color: var(--chalk-dim);
    font-size: 11px;
    margin-top: 40px;
    padding: 0 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>Matchday Calls</h1>
  <p id="updated-line">Loading predictions&hellip;</p>
</header>

<main id="content">
  <div class="loading">Fetching the latest calls&hellip;</div>
</main>

<footer>
  Predictions are a personal hobby project based on recent form, goals, and a Poisson goal model.<br>
  Not betting advice &mdash; just a bit of fun. Football is genuinely hard to predict.
</footer>

<script>
const MARKET_NAMES = {
  double_chance: 'Double Chance',
  over_under: 'Over/Under 2.5',
  btts: 'Both Teams to Score'
};

async function loadData() {
  const content = document.getElementById('content');
  const updatedLine = document.getElementById('updated-line');

  try {
    const res = await fetch('data.json?_=' + Date.now());
    if (!res.ok) throw new Error('No data yet');
    const data = await res.json();

    if (!data.predictions || data.predictions.length === 0) {
      content.innerHTML = '<div class="empty">No upcoming fixtures found in the next 7 days. Check back soon.</div>';
      updatedLine.textContent = 'Waiting for the first update';
      return;
    }

    const generated = new Date(data.generated_at);
    updatedLine.textContent = 'Updated ' + generated.toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    const groups = {};
    data.predictions.forEach(m => {
      if (!groups[m.competition]) groups[m.competition] = [];
      groups[m.competition].push(m);
    });

    let html = '';
    for (const [competition, matches] of Object.entries(groups)) {
      html += `<div class="competition-header"><h2>${competition}</h2><div class="line"></div></div>`;
      matches.forEach(m => {
        const date = new Date(m.date);
        const dateStr = date.toLocaleString(undefined, {
          weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const marketRows = Object.entries(m.markets).map(([key, market]) => {
          const isBest = key === m.best_market;
          return `
            <div class="market-row ${isBest ? 'best' : ''}">
              <div class="market-label">
                <span class="market-name">${MARKET_NAMES[key] || key}</span>
                <span class="market-pick">${market.pick}${isBest ? '<span class="best-badge">Strongest</span>' : ''}</span>
              </div>
              <span class="market-confidence">${market.confidence}%</span>
            </div>
          `;
        }).join('');

        html += `
          <div class="match-card">
            <div class="match-date">${dateStr}</div>
            <div class="teams">
              <div class="team home">
                ${m.home_crest ? `<img src="${m.home_crest}" alt="">` : ''}
                <span>${m.home_team}</span>
              </div>
              <span class="vs">VS</span>
              <div class="team away">
                <span>${m.away_team}</span>
                ${m.away_crest ? `<img src="${m.away_crest}" alt="">` : ''}
              </div>
            </div>
            <div class="markets">
              ${marketRows}
            </div>
          </div>
        `;
      });
    }

    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = '<div class="empty">No predictions yet. Once the daily update runs, matches will appear here automatically.</div>';
    updatedLine.textContent = 'Not updated yet';
  }
}

loadData();
</script>

</body>
</html>
